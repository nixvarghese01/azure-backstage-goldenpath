{{- if .Values.keyVault.secrets }}
# Key Vault secrets as read-only files via the CSI driver, authenticated with Workload Identity.
# No secretObjects: nothing is synced into Kubernetes Secret objects (secret-management.md §5).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ required "serviceAccount.workloadIdentityClientId is required" .Values.serviceAccount.workloadIdentityClientId | quote }}
    keyvaultName: {{ required "keyVault.name is required" .Values.keyVault.name | quote }}
    tenantId: {{ required "keyVault.tenantId is required" .Values.keyVault.tenantId | quote }}
    objects: |
      array:
      {{- range .Values.keyVault.secrets }}
        - |
          objectName: {{ . }}
          objectType: secret
      {{- end }}
{{- end }}
