apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: secure-nestjs-api
  title: Application starter (backend or frontend)
  description: >-
    Request an application using an enabled technology stack. The platform validates your choices, creates a repository with the
    infrastructure, provisions or reuses approved Azure resources after approval, adds the application
    as a pull request, deploys it to AKS and shares the URLs.
  tags: [backend, frontend, aks, golden-path, recommended]
  annotations:
    backstage.io/techdocs-ref: dir:../../../docs
spec:
  owner: group:default/platform-team
  type: service

  parameters:
    # ------------------------------------------------------------------ 1. What you must tell us
    - title: Your application
      description: Only these are needed. Everything on the next page is prefilled with platform defaults.
      required: [name, owner, githubAccess]
      properties:
        name:
          title: Name
          type: string
          description: 4-32 lowercase letters, digits and hyphens. Also the repository and namespace name.
          pattern: '^[a-z][a-z0-9-]{2,30}[a-z0-9]$'
          ui:autofocus: true
        owner:
          title: Owning team
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        description:
          title: Description (optional)
          type: string
          maxLength: 300
        githubAccess:
          title: GitHub access
          type: string
          description: >-
            Personal account (idp.githubOwnerType user): the repository is created with your GitHub sign-in.
            Organization: the platform's GitHub App creates it and this field is skipped.
          ui:field: IdpGithubAccess

    # ------------------------------------------------------------------ 2. Defaults (change only if needed)
    - title: Platform settings
      description: >-
        Every choice is preselected with the approved platform default. Open a dropdown only if this
        application needs something different; pick "Custom…" or "Create new…" to enter your own value.
      required: [stack, environment, infrastructure, availability, repoVisibility]
      properties:
        stack:
          title: Stack
          type: string
          default: nestjs
          ui:field: IdpStackPicker
          ui:help: Stacks awaiting target-system validation are listed as coming soon.
        environment:
          title: Environment
          type: string
          enum: [dev]
          ui:enumNames: [dev (default)]
          default: dev
        infrastructure:
          title: Azure resources
          type: object
          ui:field: IdpAzureResourcePicker
          ui:options:
            environmentField: environment
        endpointHost:
          title: Endpoint host
          type: string
          ui:field: IdpEndpointHostPicker
        availability:
          title: Availability
          type: object
          ui:field: IdpAvailabilityPicker
          ui:options:
            environmentField: environment
        repoVisibility:
          title: Repository visibility
          type: string
          enum: [public, private]
          ui:enumNames: [Public (default, recommended), Private]
          default: public
          ui:help: See the README section "Repository visibility" before choosing private.

  steps:
    # 1. Validate on the server BEFORE anything is created (waits for platform resources if needed).
    - id: submit
      name: Validate request
      action: idp:request:submit
      input:
        name: ${{ parameters.name }}
        description: ${{ parameters.description }}
        owner: ${{ parameters.owner }}
        environment: ${{ parameters.environment }}
        stack: ${{ parameters.stack }}
        infrastructure: ${{ parameters.infrastructure }}
        availability: ${{ parameters.availability }}
        endpointHost: ${{ parameters.endpointHost }}
        repoVisibility: ${{ parameters.repoVisibility }}

    # 2. Render the infrastructure-only skeleton.
    - id: fetch
      name: Render infrastructure skeleton
      action: fetch:template
      input:
        url: ./skeleton
        copyWithoutTemplating:
          - .github/workflows/**
          - deploy/helm/**
          - infra/terraform/*.tf
        values:
          name: ${{ parameters.name }}
          stack: ${{ parameters.stack }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          environment: ${{ parameters.environment }}
          requestId: ${{ steps.submit.output.requestId }}
          org: ${{ steps.submit.output.githubOrg }}
          infrastructure: ${{ parameters.infrastructure }}
          availabilityTier: ${{ parameters.availability.tier }}
          endpointHost: ${{ steps.submit.output.endpointHost }}
          stateStorageAccount: ${{ steps.submit.output.stateStorageAccount }}
          ownerType: ${{ steps.submit.output.githubOwnerType }}
          urlScheme: ${{ steps.submit.output.urlScheme }}

    # 2b. The skeleton's workflows call the platform's reusable workflows: pin them to the platform ref.
    - id: workflow-refs
      name: Pin platform workflows
      action: idp:workflow-refs

    # 3. Create the repository (built-in), with identifiers as Actions *variables* (no secrets).
    - id: publish
      name: Create repository
      action: publish:github
      input:
        token: ${{ secrets.USER_OAUTH_TOKEN if steps.submit.output.githubOwnerType == 'user' }}
        repoUrl: github.com?owner=${{ steps.submit.output.githubOrg }}&repo=${{ parameters.name }}
        description: ${{ parameters.description }}
        repoVisibility: ${{ parameters.repoVisibility }}
        defaultBranch: main
        protectDefaultBranch: true
        protectEnforceAdmins: false
        requireCodeOwnerReviews: false
        # The orchestrator merges the application PR once its CI passes; a required review would block it.
        requiredApprovingReviewCount: 0
        requiredStatusCheckContexts: []
        repoVariables:
          IDP_REQUEST_ID: ${{ steps.submit.output.requestId }}
          AZURE_SUBSCRIPTION_ID: ${{ steps.submit.output.subscriptionId }}
          ACR_NAME: ${{ steps.submit.output.acrName }}
          AKS_NAME: ${{ steps.submit.output.aksName }}
          AKS_RESOURCE_GROUP: ${{ steps.submit.output.aksResourceGroup }}
          # Read by the platform's reusable workflows (Azure sign-in, orchestrator callbacks).
          AZURE_TENANT_ID: ${{ steps.submit.output.tenantId }}
          PROVISIONING_CLIENT_ID: ${{ steps.submit.output.provisioningClientId }}
          DEPLOYMENT_CLIENT_ID: ${{ steps.submit.output.deploymentClientId }}
          IDP_CALLBACK_URL: ${{ steps.submit.output.callbackUrl }}

    # 4. GitHub environments used by the reusable workflows (ADR-0005).
    - id: env-validate
      name: Environment (validate)
      action: github:environment:create
      input:
        token: ${{ secrets.USER_OAUTH_TOKEN if steps.submit.output.githubOwnerType == 'user' }}
        repoUrl: github.com?owner=${{ steps.submit.output.githubOrg }}&repo=${{ parameters.name }}
        name: ${{ parameters.environment }}-validate
    - id: env-plan
      name: Environment (plan)
      action: github:environment:create
      input:
        token: ${{ secrets.USER_OAUTH_TOKEN if steps.submit.output.githubOwnerType == 'user' }}
        repoUrl: github.com?owner=${{ steps.submit.output.githubOrg }}&repo=${{ parameters.name }}
        name: ${{ parameters.environment }}-infra-plan
    - id: env-infra
      name: Environment (apply, held for approval in Backstage)
      action: github:environment:create
      input:
        token: ${{ secrets.USER_OAUTH_TOKEN if steps.submit.output.githubOwnerType == 'user' }}
        repoUrl: github.com?owner=${{ steps.submit.output.githubOrg }}&repo=${{ parameters.name }}
        name: ${{ parameters.environment }}-infra
        deploymentBranchPolicy:
          protected_branches: true
          custom_branch_policies: false
    - id: env-build
      name: Environment (build)
      action: github:environment:create
      input:
        token: ${{ secrets.USER_OAUTH_TOKEN if steps.submit.output.githubOwnerType == 'user' }}
        repoUrl: github.com?owner=${{ steps.submit.output.githubOrg }}&repo=${{ parameters.name }}
        name: ${{ parameters.environment }}-build
        deploymentBranchPolicy:
          protected_branches: true
          custom_branch_policies: false
    - id: env-deploy
      name: Environment (deploy)
      action: github:environment:create
      input:
        token: ${{ secrets.USER_OAUTH_TOKEN if steps.submit.output.githubOwnerType == 'user' }}
        repoUrl: github.com?owner=${{ steps.submit.output.githubOrg }}&repo=${{ parameters.name }}
        name: ${{ parameters.environment }}
        deploymentBranchPolicy:
          protected_branches: true
          custom_branch_policies: false

    # 5. Register in the catalog (built-in).
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

    # 6. Hand over to the orchestrator: attaches the approval protection rule and starts provisioning.
    - id: repository-created
      name: Start provisioning
      action: idp:request:repository-created
      input:
        requestId: ${{ steps.submit.output.requestId }}
        repoUrl: ${{ steps.publish.output.remoteUrl }}
        owner: ${{ steps.submit.output.githubOrg }}
        name: ${{ parameters.name }}
        approvalEnvironment: ${{ parameters.environment }}-infra
        token: ${{ secrets.USER_OAUTH_TOKEN if steps.submit.output.githubOwnerType == 'user' }}

  output:
    links:
      - title: Provisioning status
        icon: dashboard
        entityRef: ${{ steps.register.output.entityRef }}
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
    text:
      - title: What happens next
        content: |
          Request `${{ steps.submit.output.requestId }}` is provisioning. Infrastructure waits for
          **approval in Backstage** (IDP → Approvals). Follow progress on the entity's
          **Provisioning** tab; you'll get a notification with the URLs when it's deployed.
