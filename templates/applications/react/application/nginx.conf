pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  error_log /dev/stderr;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 3000;
    root /usr/share/nginx/html;
    location = /health/live { default_type application/json; return 200 '{"status":"ok"}'; }
    location = /health/ready { default_type application/json; return 200 '{"status":"ok","backend":"demo"}'; }
    location = /v1/orders { default_type application/json; alias /usr/share/nginx/html/orders.json; }
    location = /docs { default_type text/html; alias /usr/share/nginx/html/docs.html; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
