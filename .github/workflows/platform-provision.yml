# Stands up (or tears down) the shared dev platform in order: 20-shared-dev (AKS, ACR, PostgreSQL,
# Key Vault, DNS) -> 30-cluster-config (namespaces, Gateway, Workload Identity) -> platform-release
# (build, scan and deploy Backstage, azure-discovery and the orchestrator into AKS).
#
# Each stack runs through platform-apply.yml: static gate, plan, Conftest and Checkov on the plan, then
# apply that exact plan behind the `platform` environment's required reviewers. 00-bootstrap and the
# first 10-identities run once from an admin's machine (scripts/bootstrap-platform.sh), because they
# create the identities this pipeline signs in with.
#
# Every provision has a lifetime (ttl_hours). platform-ttl.yml destroys the stacks when it expires, so
# a forgotten dev platform doesn't keep using the subscription's credit. The run name records the TTL.
name: platform-provision
run-name: "platform-provision ${{ inputs.action }} ttl=${{ inputs.ttl_hours || 'n/a' }}h"

on:
  workflow_dispatch:
    inputs:
      action:
        description: provision (create or update) or teardown (destroy, reverse order)
        type: choice
        options: [provision, teardown]
        default: provision
      release:
        description: Deploy Backstage and the platform services after provisioning
        type: boolean
        default: true
      ttl_hours:
        description: Hours until platform-ttl destroys the platform again
        type: choice
        options: ["2", "4", "8", "24"]
        default: "4"
  workflow_call:   # platform-ttl.yml calls this with action=teardown
    inputs:
      action:
        type: string
        required: true
      release:
        type: boolean
        default: false
      ttl_hours:
        type: string
        default: ""
    secrets:
      AZURE_SUBSCRIPTION_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      BACKSTAGE_CLIENT_ID:
        required: false
      DISCOVERY_CLIENT_ID:
        required: false
      ORCHESTRATOR_CLIENT_ID:
        required: false
      PLATFORM_BACKEND_HCL:
        required: false
      PLATFORM_CHART_VALUES_JSON:
        required: false
      PLATFORM_CLIENT_ID:
        required: false
      PLATFORM_DEPLOY_CLIENT_ID:
        required: false
      PLATFORM_PLAN_CLIENT_ID:
        required: false
      PLATFORM_TFVARS_JSON:
        required: false
      VENDING_CLIENT_ID:
        required: false

permissions:
  contents: read

concurrency:
  group: platform-provision
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Branch and pipeline settings
        env:
          REF: ${{ github.ref }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          PLATFORM_CLIENT_ID: ${{ secrets.PLATFORM_CLIENT_ID }}
          PLATFORM_DEPLOY_CLIENT_ID: ${{ secrets.PLATFORM_DEPLOY_CLIENT_ID }}
          PLATFORM_BACKEND_HCL: ${{ secrets.PLATFORM_BACKEND_HCL }}
          PLATFORM_TFVARS_JSON: ${{ secrets.PLATFORM_TFVARS_JSON }}
        run: |
          [[ "$REF" == refs/heads/develop || "$REF" == refs/heads/main ]] \
            || { echo "::error::Run from develop (dev platform) or main"; exit 1; }
          missing=0
          for v in AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID PLATFORM_CLIENT_ID PLATFORM_DEPLOY_CLIENT_ID \
                   PLATFORM_BACKEND_HCL PLATFORM_TFVARS_JSON; do
            [[ -n "${!v}" ]] || { echo "::error::Secret $v is not set; run scripts/bootstrap-platform.sh github"; missing=1; }
          done
          exit "$missing"

  # Provisioning only: refuse a subscription that can be billed (Free Trial spending limit off).
  # Teardown is never blocked, because removing resources only lowers cost.
  cost-guard:
    needs: preflight
    if: inputs.action == 'provision' && vars.ALLOW_BILLED_SUBSCRIPTION != 'true'
    runs-on: ubuntu-24.04
    environment: platform-plan   # read-only identity
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.PLATFORM_PLAN_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Spending limit must be on
        env:
          SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          policies="$(az rest --method get --url "https://management.azure.com/subscriptions/${SUB}?api-version=2022-12-01" --query subscriptionPolicies -o json)"
          limit="$(jq -r '.spendingLimit // "unknown"' <<< "$policies")"
          echo "Spending limit: ${limit} ($(jq -r '.quotaId // "unknown"' <<< "$policies"))" >> "$GITHUB_STEP_SUMMARY"
          [[ "$limit" == On ]] || { echo "::error::Spending limit is ${limit}: this subscription can be billed. Set the repository variable ALLOW_BILLED_SUBSCRIPTION=true to allow it."; exit 1; }

  # ---------------- provision: 20 -> 30 -> release ----------------
  shared:
    needs: [preflight, cost-guard]
    if: inputs.action == 'provision' && !cancelled() && needs.preflight.result == 'success' && needs.cost-guard.result != 'failure'
    uses: ./.github/workflows/platform-apply.yml
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      PLATFORM_CLIENT_ID: ${{ secrets.PLATFORM_CLIENT_ID }}
      VENDING_CLIENT_ID: ${{ secrets.VENDING_CLIENT_ID }}
      PLATFORM_BACKEND_HCL: ${{ secrets.PLATFORM_BACKEND_HCL }}
      PLATFORM_TFVARS_JSON: ${{ secrets.PLATFORM_TFVARS_JSON }}
    with:
      stack: 20-shared-dev
    permissions:
      contents: read
      id-token: write

  cluster-config:
    needs: shared
    uses: ./.github/workflows/platform-apply.yml
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      PLATFORM_CLIENT_ID: ${{ secrets.PLATFORM_CLIENT_ID }}
      VENDING_CLIENT_ID: ${{ secrets.VENDING_CLIENT_ID }}
      PLATFORM_BACKEND_HCL: ${{ secrets.PLATFORM_BACKEND_HCL }}
      PLATFORM_TFVARS_JSON: ${{ secrets.PLATFORM_TFVARS_JSON }}
    with:
      stack: 30-cluster-config
    permissions:
      contents: read
      id-token: write

  release:
    needs: cluster-config
    if: inputs.release
    uses: ./.github/workflows/platform-release.yml
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      PLATFORM_DEPLOY_CLIENT_ID: ${{ secrets.PLATFORM_DEPLOY_CLIENT_ID }}
      BACKSTAGE_CLIENT_ID: ${{ secrets.BACKSTAGE_CLIENT_ID }}
      DISCOVERY_CLIENT_ID: ${{ secrets.DISCOVERY_CLIENT_ID }}
      ORCHESTRATOR_CLIENT_ID: ${{ secrets.ORCHESTRATOR_CLIENT_ID }}
      PLATFORM_CHART_VALUES_JSON: ${{ secrets.PLATFORM_CHART_VALUES_JSON }}
    permissions:
      contents: read
      id-token: write
      attestations: write

  # ---------------- teardown: 30 -> 20 (00 and 10 stay; see docs/operations/cleanup.md) ----------------
  teardown-cluster-config:
    needs: preflight
    if: inputs.action == 'teardown'
    uses: ./.github/workflows/platform-apply.yml
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      PLATFORM_CLIENT_ID: ${{ secrets.PLATFORM_CLIENT_ID }}
      VENDING_CLIENT_ID: ${{ secrets.VENDING_CLIENT_ID }}
      PLATFORM_BACKEND_HCL: ${{ secrets.PLATFORM_BACKEND_HCL }}
      PLATFORM_TFVARS_JSON: ${{ secrets.PLATFORM_TFVARS_JSON }}
    with:
      stack: 30-cluster-config
      mode: destroy
    permissions:
      contents: read
      id-token: write

  # Runs even if the cluster-config destroy failed (for example the cluster was already gone): the
  # shared stack is where the cost is.
  teardown-shared:
    needs: [preflight, teardown-cluster-config]
    if: inputs.action == 'teardown' && !cancelled() && needs.preflight.result == 'success'
    uses: ./.github/workflows/platform-apply.yml
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      PLATFORM_CLIENT_ID: ${{ secrets.PLATFORM_CLIENT_ID }}
      VENDING_CLIENT_ID: ${{ secrets.VENDING_CLIENT_ID }}
      PLATFORM_BACKEND_HCL: ${{ secrets.PLATFORM_BACKEND_HCL }}
      PLATFORM_TFVARS_JSON: ${{ secrets.PLATFORM_TFVARS_JSON }}
    with:
      stack: 20-shared-dev
      mode: destroy
    permissions:
      contents: read
      id-token: write
