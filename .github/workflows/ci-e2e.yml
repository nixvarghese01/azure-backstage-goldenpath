# Golden path across services with mocked Azure and GitHub (real discovery validation, real orchestrator,
# real NestJS stack template). Runs on PRs and pushes to develop/main, and nightly.
name: ci-e2e

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    paths: ["services/**", "templates/**", "policies/**", ".github/workflows/ci-e2e.yml"]
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
      - run: uv sync --all-packages
      - run: uv run pytest e2e -q
