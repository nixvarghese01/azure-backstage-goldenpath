# Repository-wide security checks. Code SAST is in codeql.yml; Terraform misconfiguration in ci-iac.yml.
#
# secrets       gitleaks over the full history
# workflows     actionlint (syntax, shellcheck) and zizmor (injection, permissions, credential handling)
# dependencies  Trivy: lockfile vulnerabilities, committed secrets, Dockerfile misconfiguration
name: ci-security

on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    - cron: "23 4 * * 1"   # new advisories appear without code changes

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/ci/install-tools.sh gitleaks
      - run: gitleaks detect --no-banner --redact --config .gitleaks.toml

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/ci/install-tools.sh actionlint
      - name: actionlint
        run: actionlint
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}   # online audits: impostor commits, known-vulnerable actions
        run: pipx run zizmor==1.30.1 --min-severity medium --format github .github

  dependencies:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/ci/install-tools.sh trivy
      - name: Vulnerabilities, secrets and Dockerfile misconfiguration (HIGH and CRITICAL fail)
        # --offline-scan reads lockfiles without fetching remote Maven POMs (rate limited).
        # iac/ is covered by Checkov in ci-iac; trivy would report the same findings under other IDs.
        run: |
          trivy fs --offline-scan --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
          trivy config --severity HIGH,CRITICAL --exit-code 1 --skip-dirs iac .
      - name: Full report for code scanning
        if: always()
        run: trivy fs --offline-scan --scanners vuln,secret,misconfig --skip-dirs iac --format sarif --output trivy.sarif .
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        # Forked PRs get a read-only token, so only same-repository runs upload.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: trivy.sarif
          category: trivy
