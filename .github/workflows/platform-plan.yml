# Plans changed platform stacks on pull requests (including orchestrator-raised platform requests),
# and every Monday plans the deployed stacks to detect drift: changes made in Azure outside Terraform.
# Each stack passes the static gate (fmt, validate, TFLint, Checkov) before it is planned; the plan
# itself is then checked with the Conftest plan policies and Checkov.
name: platform-plan

on:
  pull_request:
    paths: ["iac/platform/**", "iac/modules/**", "policies/**", ".github/actions/terraform-static/**"]
  workflow_dispatch:
    inputs:
      stack:
        description: Stack directory under iac/platform
        required: true
  schedule:
    - cron: "17 6 * * 1"   # drift detection, Mondays 06:17 UTC (default branch)

permissions:
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ secrets.PLATFORM_PLAN_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      stacks: ${{ steps.s.outputs.stacks }}            # static checks: every changed stack
      plan_stacks: ${{ steps.s.outputs.plan_stacks }}  # Azure plan: only what the plan identity can read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: s
        env:
          INPUT_STACK: ${{ inputs.stack }}
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
          # Stacks the plan identity can read; JSON list. Default: the shared Azure resources.
          DRIFT_STACKS: ${{ vars.PLATFORM_DRIFT_STACKS || '["20-shared-dev"]' }}
        run: |
          if [[ "$EVENT" == schedule ]]; then
            jq -c . <<< "$DRIFT_STACKS" > stacks.json
          elif [[ -n "$INPUT_STACK" ]]; then
            [[ "$INPUT_STACK" =~ ^[0-9]{2}-[a-z0-9-]+$ && -d "iac/platform/$INPUT_STACK" ]] || { echo "::error::unknown stack"; exit 1; }
            jq -cn --arg s "$INPUT_STACK" '[$s]' > stacks.json
          else
            git diff --name-only "origin/${BASE_REF}...HEAD" -- iac/platform \
              | cut -d/ -f3 | sort -u | grep -E '^[0-9]{2}-' | jq -R . | jq -sc . > stacks.json
          fi
          echo "stacks=$(cat stacks.json)" >> "$GITHUB_OUTPUT"
          # The plan identity is Azure Reader only. 00-bootstrap and 10-identities (Entra objects: needs
          # Microsoft Graph) are applied by an admin; 30-cluster-config (Kubernetes objects: needs
          # cluster access) is planned and applied by platform-apply with the platform identity. Those
          # get the static gate here, not an Azure plan.
          echo "plan_stacks=$(jq -c 'map(select(IN("00-bootstrap", "10-identities", "30-cluster-config") | not))' stacks.json)" >> "$GITHUB_OUTPUT"

  static:
    needs: detect
    if: needs.detect.outputs.stacks != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJson(needs.detect.outputs.stacks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: ./.github/actions/terraform-static
        with:
          working-directory: iac/platform/${{ matrix.stack }}
      - name: Note when Azure isn't configured yet
        if: vars.PLATFORM_AZURE_READY != 'true'
        run: echo "::warning::PLATFORM_AZURE_READY isn't true, so the Azure plan is skipped; static checks still ran. See IMPLEMENTATION_PLAN.md Phase 4."

  plan:
    needs: [detect, static]
    # Planning needs the platform plan identity; until Azure is set up, only the static gate runs.
    if: vars.PLATFORM_AZURE_READY == 'true' && needs.detect.outputs.plan_stacks != '[]'
    runs-on: ubuntu-24.04
    environment: platform-plan
    permissions:
      contents: read
      id-token: write
      pull-requests: write   # plan summary comment
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        stack: ${{ fromJson(needs.detect.outputs.plan_stacks) }}
    env:
      STACK: ${{ matrix.stack }}
    defaults:
      run:
        working-directory: iac/platform/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.PLATFORM_PLAN_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/install-tools.sh" conftest kubelogin
      - name: Write stack inputs from repository variables (IDs only)
        env:
          PLATFORM_BACKEND_HCL: ${{ secrets.PLATFORM_BACKEND_HCL }}
          PLATFORM_TFVARS_JSON: ${{ secrets.PLATFORM_TFVARS_JSON }}
        run: |
          # PLATFORM_TFVARS_JSON = {"<stack>": "<tfvars file content>", ...}; IDs only, no secrets.
          printf '%s\n' "${PLATFORM_BACKEND_HCL//__STACK__/$STACK}" > backend.hcl
          jq -r --arg s "$STACK" '.[$s] // ""' <<< "$PLATFORM_TFVARS_JSON" > terraform.tfvars   # no entry = the stack's defaults
      - name: Plan (read-only, no state lock)
        run: |
          terraform init -backend-config=backend.hcl
          terraform plan -lock=false -var-file=terraform.tfvars -out=plan.bin -no-color > plan.txt
          terraform show -json plan.bin > plan.json
      - name: Plan policy (Conftest)
        run: conftest test plan.json -p "$GITHUB_WORKSPACE/policies/terraform" -d "$GITHUB_WORKSPACE/policies/allowlist.yaml" --namespace main
      # Enrichment reads the inline checkov:skip waivers from the module sources. The root is iac/modules,
      # not the whole repo: resource names like azurerm_kubernetes_cluster.this also exist as data sources
      # in other stacks, and Checkov would match the wrong file and ignore the waivers.
      - name: Plan misconfiguration scan (Checkov, resolved values)
        run: pipx run checkov==3.3.26 -f plan.json --framework terraform_plan --repo-root-for-plan-enrichment "$GITHUB_WORKSPACE/iac/modules" --quiet --compact
      - name: Drift report (scheduled runs fail when Azure differs from the code)
        if: github.event_name == 'schedule'
        run: |
          summary="$(bash "$GITHUB_WORKSPACE/scripts/ci/plan-summary.sh" plan.json plan.bin)"
          changes="$(jq '.summary.add + .summary.change + .summary.destroy' <<< "$summary")"
          {
            echo "### Drift: \`${STACK}\`"
            if [[ "$changes" == 0 ]]; then
              echo "No drift: Azure matches the code."
            else
              echo "Azure differs from the code. Revert the manual change, or codify it in a pull request."
              jq -r '.summary.resources[] | "- \(.address): \(.actions | join("/"))"' <<< "$summary"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$changes" == 0 ]] || { echo "::error::Drift detected in ${STACK}"; exit 1; }
      - name: Comment summary on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Plan: \`${STACK}\`"
            bash "$GITHUB_WORKSPACE/scripts/ci/plan-summary.sh" plan.json plan.bin \
              | jq -r '"+\(.summary.add) ~\(.summary.change) -\(.summary.destroy)\n\n" + ([.summary.resources[] | "- `\(.address)` \(.actions|join(","))"] | join("\n"))'
          } > comment.md
          gh pr comment "$PR_NUMBER" --body-file comment.md
