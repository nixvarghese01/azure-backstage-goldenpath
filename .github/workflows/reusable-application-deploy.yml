# Reusable deploy / uninstall for generated applications on the shared AKS cluster.
# The deployment identity is bound only inside the application's namespace (idp-app-deployer).
# Helm stores release state in ConfigMaps (HELM_DRIVER=configmap): no Kubernetes Secret objects (ADR-0005).
# The exact manifests being deployed are checked against the Helm policies before the upgrade.
# A readiness or smoke check that fails after Helm succeeded (outside --atomic) restores the recorded
# previous revision and verifies it; the run still fails, and the callback says what was restored (#114).
name: reusable-application-deploy

on:
  workflow_call:
    inputs:
      platform_ref:
        description: Platform ref the caller calls this workflow at (scripts and policies come from the same ref)
        type: string
        default: main
      environment:
        type: string
        default: dev
      action:
        description: deploy | uninstall
        type: string
        default: deploy
      release:
        type: string
        required: true
      namespace:
        type: string
        required: true
      image_tag:
        type: string
        default: ""

permissions:
  contents: read

env:
  IDP_REQUEST_ID: ${{ vars.IDP_REQUEST_ID }}
  IDP_CALLBACK_URL: ${{ vars.IDP_CALLBACK_URL }}
  HELM_DRIVER: configmap
  PLATFORM: .platform
  CHART: deploy/helm/application
  ENVIRONMENT: ${{ inputs.environment }}
  ACTION: ${{ inputs.action }}
  RELEASE: ${{ inputs.release }}
  NAMESPACE: ${{ inputs.namespace }}
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate inputs
        run: |
          [[ "$ACTION" == "deploy" || "$ACTION" == "uninstall" ]] || { echo "::error::invalid action"; exit 1; }
          for v in "$ENVIRONMENT" "$RELEASE" "$NAMESPACE"; do
            [[ "$v" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]] || { echo "::error::invalid name: $v"; exit 1; }
          done
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "::error::invalid image tag"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/azure-backstage-goldenpath
          ref: ${{ inputs.platform_ref }}
          path: ${{ env.PLATFORM }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            policies
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Install verified tools
        run: bash "$PLATFORM/scripts/ci/install-tools.sh" kubelogin conftest
      - name: Policy check of the exact release manifests
        if: inputs.action == 'deploy'
        run: |
          helm template "$RELEASE" "$CHART" --namespace "$NAMESPACE" \
            --values "$CHART/values.yaml" --values "$CHART/values-${ENVIRONMENT}.yaml" \
            --set image.tag="$IMAGE_TAG" > "$RUNNER_TEMP/release.yaml"
          conftest test "$RUNNER_TEMP/release.yaml" -p "$PLATFORM/policies/helm"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.DEPLOYMENT_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Cluster credentials (Entra, no local accounts)
        env:
          AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
          AKS_NAME: ${{ vars.AKS_NAME }}
        run: |
          az aks get-credentials --resource-group "$AKS_RESOURCE_GROUP" --name "$AKS_NAME" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
      - name: Report start
        if: inputs.action == 'deploy' && env.IDP_REQUEST_ID != ''
        run: bash "$PLATFORM/scripts/ci/callback.sh" deploy started
      - name: Record the deployed release (revision, image)
        if: inputs.action == 'deploy'
        run: bash "$PLATFORM/scripts/ci/app-deploy-recovery.sh" record
      - name: Helm upgrade --install
        if: inputs.action == 'deploy'
        id: helm
        run: |
          helm upgrade --install "$RELEASE" "$CHART" \
            --namespace "$NAMESPACE" \
            --values "$CHART/values.yaml" --values "$CHART/values-${ENVIRONMENT}.yaml" \
            --set image.tag="$IMAGE_TAG" \
            --atomic --wait --timeout 10m
      - name: Readiness
        if: inputs.action == 'deploy'
        id: readiness
        run: kubectl rollout status deployment/"$RELEASE" -n "$NAMESPACE" --timeout 5m
      - name: Smoke test through the shared Gateway
        if: inputs.action == 'deploy'
        id: smoke
        run: |
          host="$(yq '.route.host' "$CHART/values-${ENVIRONMENT}.yaml")"
          ip="$(kubectl get gateway idp-gateway -n idp-gateway -o jsonpath='{.status.addresses[0].value}' 2>/dev/null || true)"
          resolve=(); [[ -n "$ip" ]] && resolve=(--resolve "${host}:80:${ip}")
          for _ in $(seq 1 20); do
            if curl -fsS "${resolve[@]}" "http://${host}/health/ready" > "$RUNNER_TEMP/ready.json"; then break; fi
            sleep 6
          done
          curl -fsS "${resolve[@]}" "http://${host}/health/ready" > "$RUNNER_TEMP/ready.json"
          curl -fsS "${resolve[@]}" "http://${host}/v1/orders" > /dev/null
          ready="$(kubectl get deployment "$RELEASE" -n "$NAMESPACE" -o jsonpath='{.status.readyReplicas}/{.spec.replicas}')"
          revision="$(helm status "$RELEASE" -n "$NAMESPACE" -o json | jq '.version')"
          jq -n --arg e "$host" --arg p "$ready" --argjson r "$revision" --arg i "$IMAGE_TAG" \
            --slurpfile h "$RUNNER_TEMP/ready.json" \
            '{endpoint:$e, pods:$p, revision:$r, image_tag:$i, health:$h[0]}' > "$RUNNER_TEMP/deploy.json"
      # Helm's --atomic covers only the upgrade itself; these checks run after it, so recover here.
      - name: Restore the previous release after a failed check
        if: failure() && (steps.readiness.outcome == 'failure' || steps.smoke.outcome == 'failure')
        env:
          CHECK: ${{ steps.readiness.outcome == 'failure' && 'readiness' || 'smoke' }}
        run: bash "$PLATFORM/scripts/ci/app-deploy-recovery.sh" recover "$CHECK"
      - name: Collect diagnostics
        if: failure() && inputs.action == 'deploy' && steps.helm.outcome != 'skipped'
        run: bash "$PLATFORM/scripts/ci/app-deploy-recovery.sh" diagnostics
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && inputs.action == 'deploy'
        with:
          name: deploy-diagnostics
          path: ${{ runner.temp }}/deploy-state
          if-no-files-found: ignore
          retention-days: 14
      - name: Helm uninstall
        if: inputs.action == 'uninstall'
        run: helm uninstall "$RELEASE" --namespace "$NAMESPACE" --wait --ignore-not-found
      - name: Report
        if: always() && env.IDP_REQUEST_ID != ''
        env:
          JOB_STATUS: ${{ job.status }}
          HELM_OUTCOME: ${{ steps.helm.outcome }}
        run: |
          stage=deploy; [[ "$ACTION" == "uninstall" ]] && stage=uninstall
          # A failure reports what failed and only the recovery the cluster confirms (never assumed).
          if [[ "$ACTION" == "deploy" && "$JOB_STATUS" != "success" ]]; then
            bash "$PLATFORM/scripts/ci/app-deploy-recovery.sh" report "$HELM_OUTCOME" > "$RUNNER_TEMP/deploy.json" \
              || echo '{"message":"The deployment failed; see the run for details."}' > "$RUNNER_TEMP/deploy.json"
          fi
          bash "$PLATFORM/scripts/ci/callback.sh" "$stage" "$JOB_STATUS" "$RUNNER_TEMP/deploy.json"
