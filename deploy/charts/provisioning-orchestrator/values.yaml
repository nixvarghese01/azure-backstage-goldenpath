image:
  repository: acridpdev.azurecr.io/idp/provisioning-orchestrator
  tag: latest
api:
  replicas: 2
worker:
  replicas: 2
workloadIdentity:
  clientId: ""            # id-idp-orchestrator-<env> (no Azure resource access)
keyVault:
  name: kv-idp-plat-dev
  tenantId: ""
database:
  # true (dev): PostgreSQL inside the cluster (deploy/charts/postgres), password login.
  # false: Azure Database for PostgreSQL with Entra authentication (url below).
  inCluster: false
  url: ""                 # postgresql+psycopg://id-idp-orchestrator-dev@<server>.postgres.database.azure.com:5432/orchestrator?sslmode=require
auth:
  tenantId: ""
  audience: ""            # app ID URI of this service
  allowedCallers: ""      # backstage object ID
config:
  githubOrg: nixvarghese01
  githubAppId: ""
  githubInstallationId: ""
  platformRepo: azure-backstage-goldenpath
  discoveryScope: ""      # api://idp-discovery/.default
  backstageScope: ""      # api://idp-backstage/.default
  approverGroup: group:default/platform-approvers
  # Comma-separated environments where approvers may approve their own request (single-person demos).
  # Empty = separation of duties everywhere. "prod" is always ignored.
  selfApprovalEnvironments: ""
hooks:
  host: platform-hooks.dev.xycorp.local
  gateway: { name: idp-gateway, namespace: idp-gateway }
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 500m, memory: 384Mi }
