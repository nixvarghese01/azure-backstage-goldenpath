# The sync script, then the restore Job: both run before the Certificate exists (pre-install/pre-upgrade).
apiVersion: v1
kind: ConfigMap
metadata:
  name: tls-sync-script
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  tls-sync.sh: |
{{ .Files.Get "files/tls-sync.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tls-restore
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tls-sync
        azure.workload.identity/use: "true"
    spec:
      {{- include "platform-tls.pod" (merge (dict "mode" "restore") .) | nindent 6 }}
---
# Backs the certificate up after it is issued or renewed (only uploads when it changed).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tls-backup
spec:
  schedule: {{ .Values.backupSchedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tls-sync
            azure.workload.identity/use: "true"
        spec:
          {{- include "platform-tls.pod" (merge (dict "mode" "backup") .) | nindent 10 }}
