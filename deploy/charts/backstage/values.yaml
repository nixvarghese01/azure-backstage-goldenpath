image:
  repository: acridpdev.azurecr.io/idp/backstage
  tag: latest
replicas: 2
database:
  # true (dev): PostgreSQL inside the cluster (deploy/charts/postgres).
  inCluster: false
workloadIdentity:
  clientId: ""             # id-idp-backstage-<env>
keyVault:
  name: kv-idp-plat-dev
  tenantId: ""
host: backstage.dev.xycorp.local
gateway: { name: idp-gateway, namespace: idp-gateway }
env:
  BACKSTAGE_BASE_URL: http://backstage.dev.xycorp.local
  POSTGRES_HOST: ""
  POSTGRES_USER: id-idp-backstage-dev
  AZURE_TENANT_ID: ""
  GITHUB_ORG: nixvarghese01
  GITHUB_APP_BACKSTAGE_ID: ""
  GITHUB_APP_BACKSTAGE_CLIENT_ID: ""
  GITHUB_APP_ORCHESTRATOR_ID: ""
  DISCOVERY_ENTRA_SCOPE: ""
  ORCHESTRATOR_ENTRA_SCOPE: ""
  BACKSTAGE_ENTRA_AUDIENCE: ""
resources:
  requests: { cpu: 100m, memory: 512Mi }   # measured ~10m idle; bursts to the limit at start-up
  limits: { cpu: "1", memory: 1Gi }
