image:
  repository: postgres
  tag: 17-alpine
storage:
  size: 8Gi
  className: ""          # cluster default (AKS: managed-csi, Standard SSD)
workloadIdentity:
  clientId: ""          # id-idp-postgres-<env> (reads only its Key Vault secrets)
keyVault:
  name: ""
  tenantId: ""
# Databases and their login roles. Passwords: Key Vault secrets postgres-password and
# <database>-db-password (scripts/create-platform-secrets.sh).
databases: [backstage, orchestrator]
# Pods allowed to connect (NetworkPolicy), by app.kubernetes.io/name.
clients:
  - backstage
  - provisioning-orchestrator-api
  - provisioning-orchestrator-worker
  - provisioning-orchestrator-migrate
resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { cpu: "1", memory: 512Mi }
