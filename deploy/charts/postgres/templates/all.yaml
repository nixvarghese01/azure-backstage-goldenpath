apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres }
  annotations:
    azure.workload.identity/client-id: {{ required "workloadIdentity.clientId" .Values.workloadIdentity.clientId | quote }}
---
# Passwords come from Key Vault (scripts/create-platform-secrets.sh) through the CSI driver, read with
# this workload's own identity and per-secret RBAC. No secretObjects, so no Kubernetes Secret.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: postgres
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.workloadIdentity.clientId | quote }}
    keyvaultName: {{ required "keyVault.name" .Values.keyVault.name | quote }}
    tenantId: {{ required "keyVault.tenantId" .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: postgres-password
          objectType: secret
        {{- range .Values.databases }}
        - |
          objectName: {{ . }}-db-password
          objectType: secret
        {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels: { app.kubernetes.io/name: postgres }
data:
  # Runs once, on an empty data directory: one login role and one database per service.
  10-databases.sh: |
    #!/bin/sh
    set -eu
    for db in {{ join " " .Values.databases }}; do
      pw="$(cat "/mnt/secrets/${db}-db-password")"
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres -v db="$db" -v pw="$pw" <<'SQL'
    CREATE USER :"db" PASSWORD :'pw';
    CREATE DATABASE :"db" OWNER :"db";
    REVOKE ALL ON DATABASE :"db" FROM PUBLIC;
    SQL
    done
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70       # postgres user in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_PASSWORD_FILE, value: /mnt/secrets/postgres-password }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: secrets, mountPath: /mnt/secrets, readOnly: true }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            exec: { command: [pg_isready, -U, postgres, -h, 127.0.0.1] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: [pg_isready, -U, postgres, -h, 127.0.0.1] }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - { name: init, configMap: { name: postgres-init, defaultMode: 0555 } }
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: postgres }
        - { name: run, emptyDir: { sizeLimit: 16Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.storage.className }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres }
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: postgres }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: {{ toJson .Values.clients }} }
      ports: [{ port: 5432 }]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
