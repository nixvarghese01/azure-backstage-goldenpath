apiVersion: v1
kind: ServiceAccount
metadata:
  name: azure-discovery
  annotations:
    azure.workload.identity/client-id: {{ required "workloadIdentity.clientId" .Values.workloadIdentity.clientId | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: azure-discovery-allowlist
data:
  allowlist.yaml: {{ required "allowlist (use --set-file)" .Values.allowlist | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-discovery
  labels: { app.kubernetes.io/name: azure-discovery }
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: azure-discovery }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: azure-discovery
        azure.workload.identity/use: "true"
      annotations:
        checksum/allowlist: {{ .Values.allowlist | sha256sum }}
    spec:
      serviceAccountName: azure-discovery
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{ name: http, containerPort: 8001 }]
          env:
            - { name: DISCOVERY_AZURE_MODE, value: sdk }
            - { name: DISCOVERY_POLICY_FILE, value: /etc/sportify/allowlist.yaml }
            - { name: SPORTIFY_AUTH_MODE, value: entra }
            - { name: SPORTIFY_ENTRA_TENANT_ID, value: {{ .Values.auth.tenantId | quote }} }
            - { name: SPORTIFY_ENTRA_AUDIENCE, value: {{ .Values.auth.audience | quote }} }
            - { name: SPORTIFY_ALLOWED_CALLERS, value: {{ .Values.auth.allowedCallers | quote }} }
          volumeMounts:
            - { name: allowlist, mountPath: /etc/sportify, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - { name: allowlist, configMap: { name: azure-discovery-allowlist } }
        - { name: tmp, emptyDir: { sizeLimit: 32Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: azure-discovery
spec:
  selector: { app.kubernetes.io/name: azure-discovery }
  ports: [{ name: http, port: 8001, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: azure-discovery
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: azure-discovery }
---
# Only Backstage and the orchestrator worker may call discovery; egress to DNS and HTTPS (ARM, Entra).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: azure-discovery
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: azure-discovery }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: backstage } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: provisioning-orchestrator-worker } }
      ports: [{ port: 8001 }]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - ports: [{ port: 443, protocol: TCP }]
