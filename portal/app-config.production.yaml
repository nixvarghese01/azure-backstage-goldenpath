# Production (AKS) overrides. Secrets come from files mounted by the Secrets Store CSI driver
# (/mnt/secrets/*), never from environment values or this file (docs/security/secret-management.md).
app:
  baseUrl: ${BACKSTAGE_BASE_URL}

backend:
  baseUrl: ${BACKSTAGE_BASE_URL}
  listen:
    port: 7007
  cors:
    origin: ${BACKSTAGE_BASE_URL}
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: 5432
      user: ${POSTGRES_USER}
      # Entra authentication where supported; otherwise S7 fallback password file (secret-management §3).
      password:
        $file: /mnt/secrets/backstage-db-password
      database: backstage
      ssl:
        rejectUnauthorized: true
    pluginDivisionMode: schema
  auth:
    # Lets the orchestrator send notifications with its Entra workload token (no shared secret).
    externalAccess:
      - type: jwks
        options:
          url: https://login.microsoftonline.com/${AZURE_TENANT_ID}/discovery/v2.0/keys
          issuer: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
          audience: ${BACKSTAGE_ENTRA_AUDIENCE}
          subjectPrefix: orchestrator
        accessRestrictions:
          - plugin: notifications
          # Cleanup removes the application's entity (CLEANED_UP): read + delete only.
          - plugin: catalog
            permission: catalog.entity.read
          - plugin: catalog
            permission: catalog.entity.delete

integrations:
  github:
    - host: github.com
      apps:
        - appId: ${GITHUB_APP_BACKSTAGE_ID}
          clientId: ${GITHUB_APP_BACKSTAGE_CLIENT_ID}
          clientSecret:
            $file: /mnt/secrets/gh-app-backstage-client-secret
          privateKey:
            $file: /mnt/secrets/gh-app-backstage-key
          webhookSecret: unused

auth:
  environment: production
  session:
    secret:
      $file: /mnt/secrets/backstage-session-secret
  providers:
    github:
      production:
        clientId: ${GITHUB_APP_BACKSTAGE_CLIENT_ID}
        clientSecret:
          $file: /mnt/secrets/gh-app-backstage-client-secret
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName

catalog:
  locations:
    - type: file
      target: ./catalog/org.yaml
      rules:
        - allow: [Group, User]
    - type: file
      target: ./catalog/platform.yaml
    - type: url
      target: https://github.com/${GITHUB_ORG}/azure-backstage-goldenpath/blob/main/templates/applications/nestjs/template.yaml
      rules:
        - allow: [Template]

sportify:
  githubOrg: ${GITHUB_ORG}
  orchestratorGithubAppId: ${GITHUB_APP_ORCHESTRATOR_ID}
  discovery:
    baseUrl: http://azure-discovery.sportify-platform.svc.cluster.local:8001
  orchestrator:
    baseUrl: http://provisioning-orchestrator-api.sportify-platform.svc.cluster.local:8002
  auth:
    mode: entra
    discoveryScope: ${DISCOVERY_ENTRA_SCOPE}
    orchestratorScope: ${ORCHESTRATOR_ENTRA_SCOPE}

techdocs:
  builder: local
  generator:
    runIn: local
  publisher:
    type: local
    local:
      # The root filesystem is read-only; generated docs go to the writable /tmp volume.
      publishDirectory: /tmp/techdocs
