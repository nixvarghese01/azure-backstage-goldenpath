apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: sportify-platform
  description: Sportify Azure Backstage internal developer platform
spec:
  owner: group:default/platform-team
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: backstage
  description: Developer portal (catalog, scaffolder, TechDocs) with the Sportify bridge
spec:
  type: website
  lifecycle: production
  owner: group:default/platform-team
  system: sportify-platform
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: azure-discovery
  description: Read-only Azure discovery and eligibility validation (Python, FastAPI)
spec:
  type: service
  lifecycle: production
  owner: group:default/platform-team
  system: sportify-platform
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: provisioning-orchestrator
  description: Durable request orchestrator (Python, FastAPI + worker)
spec:
  type: service
  lifecycle: production
  owner: group:default/platform-team
  system: sportify-platform
