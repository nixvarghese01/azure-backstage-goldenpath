# Demo organisation. Replace user names with real GitHub usernames (sign-in resolves by user name).
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  description: Owns the IDP platform
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-approvers
  description: May approve infrastructure changes (idp.request.approve)
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: team-orders
  description: Example application team
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: alex
spec:
  profile:
    displayName: Alex (developer)
  memberOf: [team-orders]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: sam
spec:
  profile:
    displayName: Sam (platform approver)
  memberOf: [platform-team, platform-approvers]
