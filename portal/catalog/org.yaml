# Demo organisation. A user's metadata.name must be their GitHub username: sign-in resolves by it.
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  description: Owns the IDP platform
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-approvers
  description: May approve infrastructure changes (idp.request.approve)
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: team-orders
  description: Example application team
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: nixvarghese01
spec:
  profile:
    displayName: Nixon (developer and platform approver)
  # Also an approver: can approve other people's requests. Approving your own request is blocked
  # (separation of duties) unless ORCHESTRATOR_SELF_APPROVAL_ENVIRONMENTS includes the environment,
  # e.g. "dev" for a single-person demo.
  memberOf: [team-orders, platform-approvers]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: ancy   # replace with Ancy's GitHub username
spec:
  profile:
    displayName: Ancy (platform approver)
  memberOf: [platform-team, platform-approvers]
