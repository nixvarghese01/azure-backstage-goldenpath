# Loopback-only local Compose profile. Never load this override in AKS.
backend:
  database:
    client: pg
    connection:
      host: postgres
      port: 5432
      user: backstage
      password: dev-only-not-a-secret
      database: backstage
    pluginDivisionMode: schema
  auth:
    externalAccess:
      - type: static
        options:
          token: ${IDP_DEV_SERVICE_TOKEN}
          subject: local-orchestrator
        accessRestrictions:
          - plugin: notifications
          # One entry per plugin: Backstage rejects a plugin declared twice, so permissions are a list.
          - plugin: catalog
            permission: [catalog.entity.read, catalog.entity.delete]
techdocs:
  # Lightweight image serves prebuilt docs; the optional full override enables generation.
  builder: external
auth:
  environment: local-docker
  providers:
    guest:
      # The image runs NODE_ENV=production; this opt-in applies only to this local override.
      dangerouslyAllowOutsideDevelopment: true
      userEntityRef: user:default/nixvarghese01
      ownershipEntityRefs: [user:default/nixvarghese01, group:default/team-orders]
idp:
  githubOrg: ${ORCHESTRATOR_GITHUB_ORG}
  orchestratorGithubAppId: 0
  discovery:
    baseUrl: http://azure-discovery:8001
  orchestrator:
    baseUrl: http://orchestrator-api:8002
  auth:
    mode: static
    devToken: ${IDP_DEV_SERVICE_TOKEN}
