# Local development configuration. Secrets never go here: use app-config.local.yaml (git-ignored)
# or files fetched by scripts/dev-secrets.sh into ~/.config/sportify/.
app:
  title: Sportify Azure Backstage
  baseUrl: http://localhost:3000

organization:
  name: Sportify

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: pg
    connection:
      host: localhost
      port: 5432
      user: backstage
      password: dev-only-not-a-secret   # local docker compose only
      database: backstage
    pluginDivisionMode: schema

integrations:
  github:
    - host: github.com
      apps:
        # GitHub App #1 (Backstage): repository creation, environments, catalog reads.
        - $include: ${GITHUB_APP_BACKSTAGE_CREDENTIALS_FILE}

auth:
  environment: development
  providers:
    github:
      development:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName

permission:
  enabled: true

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, Template, Group, User]
  locations:
    - type: file
      target: ../../catalog/org.yaml
      rules:
        - allow: [Group, User]
    - type: file
      target: ../../catalog/platform.yaml
    - type: file
      target: ../../../templates/applications/nestjs/template.yaml
      rules:
        - allow: [Template]

techdocs:
  builder: local
  generator:
    runIn: local
  publisher:
    type: local

scaffolder:
  defaultAuthor:
    name: Sportify Platform
    email: platform@sportify.example

# --------------------------------------------------------------------- Sportify
sportify:
  githubOrg: sportify-org
  orchestratorGithubAppId: 0              # GitHub App #2 ID (set in app-config.local.yaml)
  approverGroup: group:default/platform-approvers
  submitTimeoutMinutes: 360
  discovery:
    baseUrl: http://localhost:8001
  orchestrator:
    baseUrl: http://localhost:8002
  auth:
    mode: static                          # local only; production uses Entra (see production config)
    devToken: ${SPORTIFY_DEV_SERVICE_TOKEN}
  stacks:
    - { id: nestjs, name: NestJS (TypeScript), enabled: true }
    - { id: fastapi, name: Python FastAPI, enabled: false }
    - { id: dotnet, name: .NET, enabled: false }
