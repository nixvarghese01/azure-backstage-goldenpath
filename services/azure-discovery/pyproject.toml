[project]
name = "azure-discovery"
version = "0.1.0"
description = "Read-only Azure discovery and eligibility validation for Sportify Azure Backstage"
requires-python = ">=3.14,<3.15"
dependencies = [
  "sportify-common",
  "fastapi[standard]~=0.143.0",
  "pydantic~=2.14",
  "uvicorn[standard]~=0.54.0",
  "pyyaml>=6.0",
  "azure-identity~=1.26",
  "azure-mgmt-resourcegraph~=8.0",
  "azure-mgmt-resource-subscriptions~=1.0",
  "azure-mgmt-compute>=34.0",
]

[tool.uv.sources]
sportify-common = { workspace = true }

[project.scripts]
azure-discovery = "azure_discovery.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/azure_discovery"]
