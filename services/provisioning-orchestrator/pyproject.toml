[project]
name = "provisioning-orchestrator"
version = "0.1.0"
description = "Durable request orchestrator for the IDP golden path"
requires-python = ">=3.14,<3.15"
dependencies = [
  "idp-common",
  "fastapi~=0.143.0",
  "pydantic~=2.14",
  "uvicorn~=0.54.0",
  "sqlalchemy~=2.1.0",
  "alembic~=1.20",
  "psycopg[binary]~=3.3",
  "httpx>=0.28",
  "pyjwt[crypto]>=2.10",
  "jinja2>=3.1",
  "azure-identity~=1.26",
]

[tool.uv.sources]
idp-common = { workspace = true }

[project.scripts]
orchestrator-api = "provisioning_orchestrator.main:run"
orchestrator-worker = "provisioning_orchestrator.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provisioning_orchestrator"]
