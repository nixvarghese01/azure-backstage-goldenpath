[alembic]
script_location = migrations
# The URL comes from ORCHESTRATOR_DATABASE_URL (see migrations/env.py); never put credentials here.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
