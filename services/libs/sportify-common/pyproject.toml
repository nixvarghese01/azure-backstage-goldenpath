[project]
name = "sportify-common"
version = "0.1.0"
description = "Shared auth, settings, logging and telemetry for Sportify platform services"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi~=0.143.0",
  "pydantic~=2.14",
  "pyjwt[crypto]>=2.10",
  "opentelemetry-sdk~=1.45",
  "opentelemetry-exporter-otlp-proto-http~=1.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sportify_common"]
